# API de la copia de trabajo (/srv/officelab-dev), para poder cambiar endpoints sin
# desplegar. Levanta un SEGUNDO contenedor de la API, construido desde el `api/` de esta
# copia, en 127.0.0.1:8001. El único que le habla es `dev-server.js`.
#
# ⚠️ El servicio se llama `api-dev` y NO `api` a propósito. Compose registra el nombre
# del servicio como alias DNS en la red, y esta red es la de producción: con `api`,
# el `reverse_proxy api:8000` de Caddy resolvía a los DOS contenedores y repartía el
# tráfico real entre producción y esta copia. Del 2026-09-25 al 2026-09-29 eso sacaba
# a los asesores a los segundos de entrar: la sesión nacía en un esquema y la
# siguiente petición caía en el otro. No le pongas `api` ni ningún alias que Caddy use.
#
#   cd /srv/officelab-dev/vps
#   docker compose -p officelab-dev --env-file /srv/officelab/vps/.env \
#     -f docker-compose.dev.yml up -d --build --remove-orphans
#   API=http://127.0.0.1:8001 npm run dev      # desde /srv/officelab-dev
#
# Usa la MISMA base de datos que producción, porque levantar una copia de 1.1 GB para
# probar un filtro no tiene sentido, pero con `search_path=dev,public`: las tablas del
# CRM (usuarios, sesiones, clientes, fichas, procesos, tareas) salen del esquema `dev`,
# que es una copia que crea `vps/dev-schema.sql`, y el inventario se sigue leyendo de
# `public`. Lo que se escribe en dev ya no lo ven los asesores. Si el esquema `dev` no
# existe, la API cae a `public` sin avisar: créalo antes de levantar esto.
#
# Se apaga con:  docker compose -p officelab-dev -f docker-compose.dev.yml down
name: officelab-dev

services:
  api-dev:
    build: ../api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?options=-csearch_path%3Ddev%2Cpublic
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      # Llave de servidor para Static Maps y Places (api/entorno.py). Vacía, el
      # análisis sale sin mapa ni entorno; nunca es la de web/config.js.
      GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY:-}
    # Otro puerto que el 8000 de producción, y sólo en loopback.
    ports:
      - "127.0.0.1:8001:8000"
    # La red la crea el compose de producción; aquí se usa tal cual para alcanzar a `db`.
    networks: [officelab]

networks:
  officelab:
    external: true
    name: officelab_default
