name: Claude Code Review

# Revision automatica de cada pull request con Claude.
# Usa la suscripcion de Claude (no API key). Requiere la GitHub App de Claude instalada
# en el repo y el secret CLAUDE_CODE_OAUTH_TOKEN, que sale de `claude setup-token`.
# Atajo: corre /install-github-app dentro de Claude Code y sigue los pasos.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # El plugin a veces firma sus comentarios; el dueño del repo no quiere atribución.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Never add a 'Generated with Claude Code' footer, a Co-Authored-By line, or any other Claude attribution to comments, reviews or commits."
