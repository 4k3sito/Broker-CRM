<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes · OfficeLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hermes.css">
<script src="theme.js"></script>
</head>
<body>

<header class="topbar">
  <a class="brand-group" href="index.html" aria-label="OfficeLab, propiedades">
    <svg class="brand-mark" width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect x="2" y="2" width="28" height="28" stroke="currentColor" stroke-width="2"/>
      <rect x="9" y="9" width="14" height="14" fill="currentColor"/>
      <rect x="13.5" y="13.5" width="5" height="5" fill="var(--topbar)"/>
    </svg>
    <span class="brand-text">
      <span class="brand">Office<i>Lab</i></span>
      <span class="brand-sub">CRM Inmobiliario &#183; M&#233;xico</span>
    </span>
  </a>
  <nav class="topbar-nav">
    <a href="index.html">Inmuebles</a>
    <a href="clientes.html" class="active" aria-current="page">Clientes</a>
    <a href="tareas.html">Tareas</a>
    <a href="scrapers.html">Scrapers</a>
  </nav>
  <div class="topbar-search">
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="clientSearch" placeholder="Buscar clientes&#8230;">
    </div>
  </div>
  <div class="topbar-right">
    <span class="count-tag" id="countTag" hidden><strong id="countNum">0</strong> / <span id="countTotal">0</span></span>
    <span id="authBox">
      <a class="btn-ghost" href="login.html">Entrar</a>
    </span>
    <span id="userBox" hidden>
      <button class="btn-ghost" id="logout-btn">Salir</button>
    </span>
  </div>
</header>

<main class="pg" id="clientes">
  <header class="pg-head">
    <div>
      <p class="pg-eyebrow">Prospectos y seguimiento</p>
      <h1 class="pg-title">Clientes</h1>
    </div>
    <div class="pg-kpis" id="kpis"></div>
  </header>

  <div class="pg-filters" id="filterbar">
    <span class="statebar-label">Etapa</span>
    <button class="pill-line active" data-status="all">Todas <span class="pill-count" data-count="all">0</span></button>
    <button class="pill-line" data-status="presentado">Presentado <span class="pill-count" data-count="presentado">0</span></button>
    <button class="pill-line" data-status="aprobado">Aprobado <span class="pill-count" data-count="aprobado">0</span></button>
    <button class="pill-line" data-status="rechazado">Rechazado <span class="pill-count" data-count="rechazado">0</span></button>
    <button class="btn-solid" id="new-client-btn">&#43; Nuevo cliente</button>
  </div>

  <div id="clientesBody"><p class="pg-empty">Cargando clientes&#8230;</p></div>
</main>
<script src="api.js"></script>
<script src="menu.js"></script>
<script src="clientes.js"></script>
</body>
</html>
