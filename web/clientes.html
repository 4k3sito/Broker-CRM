<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes · OfficeLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="clientes.css">
</head>
<body>

<header class="topbar">
  <a class="brand-group" href="index.html" aria-label="OfficeLab, propiedades">
    <svg class="brand-mark" width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect x="2" y="2" width="28" height="28" stroke="currentColor" stroke-width="2"/>
      <rect x="9" y="9" width="14" height="14" fill="currentColor"/>
      <rect x="13.5" y="13.5" width="5" height="5" fill="var(--topbar)"/>
    </svg>
    <span class="brand-text">
      <span class="brand">Office<i>Lab</i></span>
      <span class="brand-sub">CRM Inmobiliario &#183; M&#233;xico</span>
    </span>
  </a>
  <nav class="topbar-nav">
    <a href="index.html">Propiedades</a>
    <a href="clientes.html" class="active" aria-current="page">Clientes</a>
  </nav>
  <div class="topbar-right">
    <span class="count-tag" id="countTag" hidden><strong id="countNum">0</strong> / <span id="countTotal">0</span></span>
    <span id="authBox">
      <a class="btn-ghost" href="login.html">Entrar</a>
    </span>
    <span id="userBox" hidden>
      <span class="count-tag" id="userEmail"></span>
      <button class="btn-ghost" id="logout-btn">Salir</button>
    </span>
  </div>
</header>

<nav class="filterbar" id="filterbar">
  <div class="filter-group">
    <span class="filter-group-label">Estado</span>
    <button class="pill active" data-status="all">Todos <span class="pill-count" data-count="all">0</span></button>
    <button class="pill" data-status="presentado">Presentado <span class="pill-count" data-count="presentado">0</span></button>
    <button class="pill" data-status="aprobado">Aprobado <span class="pill-count" data-count="aprobado">0</span></button>
    <button class="pill" data-status="rechazado">Rechazado <span class="pill-count" data-count="rechazado">0</span></button>
  </div>
  <div class="filter-search">
    <input type="text" id="clientSearch" placeholder="BUSCAR CLIENTE POR NOMBRE">
  </div>
  <div class="filter-action">
    <button class="btn-solid" id="new-client-btn">&#43; Nuevo cliente</button>
  </div>
</nav>

<div class="statsbar" id="statsbar" hidden></div>

<main id="clientes">
  <p class="empty">Cargando clientes&#8230;</p>
</main>

<script src="api.js"></script>
<script src="clientes.js"></script>
</body>
</html>
