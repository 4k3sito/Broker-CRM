<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#201333">
<title>Propiedad &#183; OfficeLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hermes.css">
<script src="theme.js"></script>
</head>
<body>

<header class="topbar">
  <a class="brand-group" href="index.html" aria-label="OfficeLab, propiedades">
    <svg class="brand-mark" width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect x="2" y="2" width="28" height="28" stroke="currentColor" stroke-width="2"/>
      <rect x="9" y="9" width="14" height="14" fill="currentColor"/>
      <rect x="13.5" y="13.5" width="5" height="5" fill="var(--topbar)"/>
    </svg>
    <span class="brand-text"><span class="brand">Office<i>Lab</i></span></span>
  </a>
  <div class="topbar-right">
    <span id="authBox"><a class="btn-ghost" href="login.html">Entrar</a></span>
    <span id="userBox" hidden><button class="btn-ghost" id="logout-btn">Salir</button></span>
  </div>
</header>

<main class="fx" id="detail">
  <p class="pg-empty" style="margin:40px 20px">Cargando propiedad&#8230;</p>
</main>

<!-- Ubicación: fuera de #detail por lo mismo que el mercado comparable. El mapa es
     MapLibre con teselas de OpenFreeMap (ubicacion.js): sin llave de Google. -->
<section class="mk" id="ubicacion" hidden>
  <div class="fx-card">
    <h2>Ubicaci&#243;n <span class="fx-n" id="ubNota"></span></h2>
    <div class="ub-mapa">
      <div id="ubMap"></div>
      <div class="ub-zoom">
        <button id="ubMas" aria-label="Acercar">+</button>
        <button id="ubMenos" aria-label="Alejar">&#8722;</button>
      </div>
      <div class="map-note" id="ubAviso" hidden></div>
    </div>
    <p class="ub-pie">
      <button class="fx-btn" id="ubFijar" hidden>Fijar ubicaci&#243;n</button>
      <a class="fx-btn" id="ubGmaps" href="#" target="_blank" rel="noopener" hidden>Abrir en Google Maps &#8599;</a>
      <span>&#169; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> &#183; <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> &#183; <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a></span>
    </p>
  </div>
</section>

<!-- Mercado comparable: fuera de #detail porque render() reescribe ese bloque
     entero en cada cambio y se llevaría el mapa con él. -->
<section class="mk" id="mercado" hidden></section>

<!-- Visor de fotos a pantalla completa -->
<div class="fx-lb" id="lightbox" hidden>
  <button class="fx-lb-x" id="lbClose" aria-label="Cerrar">&times;</button>
  <button class="fx-lb-nav prev" id="lbPrev" aria-label="Anterior">&#8592;</button>
  <img id="lbImg" alt="">
  <button class="fx-lb-nav next" id="lbNext" aria-label="Siguiente">&#8594;</button>
  <span class="fx-lb-n" id="lbN"></span>
</div>

<!-- Ficha técnica Pro Realtors: sólo visible al imprimir -->
<div id="ficha-print"></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="texto.js"></script>
<script src="etapas.js"></script>
<script src="menu.js"></script>
<script src="fotos.js"></script>
<script src="vendor/maplibre-gl.js"></script>
<script src="ubicacion.js"></script>
<script src="listing.js"></script>
</body>
</html>
