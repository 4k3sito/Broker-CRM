<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#201333">
<title>Tareas &#183; OfficeLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hermes.css">
</head>
<body>
<header class="topbar">
  <a class="brand-group" href="index.html" aria-label="OfficeLab, propiedades">
    <svg class="brand-mark" width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect x="2" y="2" width="28" height="28" stroke="currentColor" stroke-width="2"/>
      <rect x="9" y="9" width="14" height="14" fill="currentColor"/>
      <rect x="13.5" y="13.5" width="5" height="5" fill="var(--topbar)"/>
    </svg>
    <span class="brand-text">
      <span class="brand">Office<i>Lab</i></span>
      <span class="brand-sub">CRM Inmobiliario &#183; M&#233;xico</span>
    </span>
  </a>
  <nav class="topbar-nav">
    <a href="index.html">Propiedades</a>
    <a href="clientes.html">Clientes</a>
    <a href="tareas.html" class="active" aria-current="page">Tareas</a>
  </nav>
  <div class="topbar-search">
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="BUSCAR TAREA O C&#211;DIGO">
    </div>
  </div>
  <div class="topbar-right">
    <span class="count-tag"><strong id="countNum">0</strong> / <span id="countTotal">0</span></span>
    <button class="btn-csv" id="nueva-btn">&#43; Nueva tarea</button>
    <span id="authBox">
      <a class="btn-ghost" href="login.html">Entrar</a>
    </span>
    <span id="userBox" hidden>
      <span class="count-tag" id="userEmail"></span>
      <button class="btn-ghost" id="logout-btn">Salir</button>
    </span>
  </div>
</header>

<nav class="filterbar" aria-label="Filtros de tareas">
  <div class="filter-group">
    <span class="filter-group-label">Vista</span>
    <div id="viewPills"></div>
  </div>
  <div class="filter-group">
    <span class="filter-group-label">Prioridad</span>
    <div id="prioPills"></div>
  </div>
  <div class="filter-group" id="personaGroup" hidden>
    <span class="filter-group-label">Persona</span>
    <div id="personaPills"></div>
  </div>
</nav>

<div class="statsbar" id="statsBar"></div>

<main id="vista"></main>

<!-- Panel lateral: detalle de una tarea o alta de una nueva. -->
<aside class="tk-side" id="side" hidden aria-label="Detalle de tarea"></aside>
<div class="tk-scrim" id="scrim" hidden></div>

<script src="api.js"></script>
<script src="tareas.js"></script>
</body>
</html>
