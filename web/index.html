<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#201333">
<title>Propiedades &#183; OfficeLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hermes.css">
<script src="theme.js"></script>
</head>
<body>

<header class="topbar">
  <a class="brand-group" href="index.html" aria-label="OfficeLab, propiedades">
    <svg class="brand-mark" width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect x="2" y="2" width="28" height="28" stroke="currentColor" stroke-width="2"/>
      <rect x="9" y="9" width="14" height="14" fill="currentColor"/>
      <rect x="13.5" y="13.5" width="5" height="5" fill="var(--topbar)"/>
    </svg>
    <span class="brand-text">
      <span class="brand">Office<i>Lab</i></span>
      <span class="brand-sub">CRM Inmobiliario &#183; M&#233;xico</span>
    </span>
  </a>

  <div class="topbar-search">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <span class="street-chip" id="searchChip" hidden>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span id="searchChipText"></span>
        <span class="street-chip-close" id="searchChipClose">&times;</span>
      </span>
      <input type="text" id="searchInput" placeholder="Buscar por direcci&#243;n o t&#237;tulo&#8230;">
    </div>
    <div class="search-suggestions" id="searchSuggestions"></div>
  </div>

  <nav class="topbar-nav">
    <a href="index.html" class="active" aria-current="page">Inmuebles</a>
    <a href="clientes.html">Clientes</a>
    <a href="tareas.html">Tareas</a>
    <a href="scrapers.html">Scrapers</a>
  </nav>

  <div class="topbar-right">
    <span class="topbar-rule" aria-hidden="true">/\-_=+|&lt;&#183;~:*-/</span>
    <span class="count-tag"><strong id="countNum">0</strong> / <span id="countTotal">0</span></span>
    <span id="authBox">
      <a class="btn-ghost" href="login.html">Entrar</a>
    </span>
    <span id="userBox" hidden>
      <button class="btn-ghost" id="logout-btn">Salir</button>
    </span>
  </div>
</header>

<!-- Sentencia editable: un token por filtro, la paleta los agrega. -->
<div class="qbar" id="qbar">
  <div class="qbar-box" id="qbarBox">
    <span class="qbar-label">Mostrar</span>
    <span id="tokens"></span>
    <button class="qbar-add" id="qbar-add">+ filtro <span class="qbar-kbd">&#8984;K</span></button>
    <button class="qbar-clear" id="qbar-clear" hidden>Limpiar</button>
  </div>
  <div class="qbar-sentence" id="qbarSentence"></div>

  <div class="qpop qpop-pal" id="palette" hidden>
    <input class="qpop-in" id="palInput" placeholder="Buscar filtro: precio, radio, colonia, fuente&#8230;">
    <div id="palList"></div>
  </div>

  <div class="qpop qpop-ed" id="editor" hidden></div>
</div>

<div class="statebar" id="statebar">
  <span class="statebar-label">Estado</span>
  <span id="statusPills"></span>
  <span class="statebar-sep"></span>
  <button class="pill" id="pill-starred" data-group="starred">
    <span class="pill-dot" style="background:var(--accent)"></span>Destacados<span class="pill-count" id="starredCount">0</span>
  </button>
  <button class="btn-clear" id="export-btn">Exportar CSV</button>
</div>

<div class="statsbar" id="statsBar"></div>

<main class="grid" id="grid"></main>
<div class="pagination" id="pagination"></div>

<footer class="appfoot">
  <span>OFFICELAB v0.4</span><span>&#183;</span>
  <span id="footFuentes">&#8212;</span><span>&#183;</span>
  <span id="footCount">0 RESULTADOS</span>
  <span class="appfoot-rule" aria-hidden="true">=+|&lt;&#183;~:*</span>
</footer>

<script src="api.js"></script>
<script src="menu.js"></script>
<script src="app.js"></script>
</body>
</html>
