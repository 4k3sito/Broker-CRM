<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#201333">
<title>Propiedades &#183; OfficeLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hermes.css">
<script src="theme.js"></script>
</head>
<body class="inm-page">

<header class="topbar">
  <a class="brand-group" href="index.html" aria-label="OfficeLab, propiedades">
    <svg class="brand-mark" width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect x="2" y="2" width="28" height="28" stroke="currentColor" stroke-width="2"/>
      <rect x="9" y="9" width="14" height="14" fill="currentColor"/>
      <rect x="13.5" y="13.5" width="5" height="5" fill="var(--topbar)"/>
    </svg>
    <span class="brand-text"><span class="brand">Office<i>Lab</i></span></span>
  </a>
  <!-- Las pestañas las pone menu.js: un solo lugar para las seis páginas. -->
  <div class="topbar-right">
    <span id="authBox"><a class="btn-ghost" href="login.html">Entrar</a></span>
    <span id="userBox" hidden><button class="btn-ghost" id="logout-btn">Salir</button></span>
  </div>
</header>

<!-- Búsqueda y filtros en una sola caja: el buscador es el primer "token". -->
<div class="qbar" id="qbar">
  <!-- Barra fija: los tres filtros que el asesor usa siempre. El popover y su fondo
       viven fuera de .fb para que en el teléfono la hoja inferior no herede su ancho. -->
<div class="fb" id="fb">
  <span class="fb-chip" data-f="ubicacion">
    <button class="fb-open" data-f="ubicacion" aria-expanded="false" aria-haspopup="dialog">
      <span class="fb-k">Ubicaci&#243;n</span><span class="fb-v" id="fbv-ubicacion">Todo M&#233;xico</span>
    </button>
    <button class="fb-x" data-x="ubicacion" title="Quitar ubicaci&#243;n" hidden>&times;</button>
  </span>
  <span class="fb-chip" data-f="precio">
    <button class="fb-open" data-f="precio" aria-expanded="false" aria-haspopup="dialog">
      <span class="fb-k">Precio</span><span class="fb-v" id="fbv-precio">Cualquiera</span>
    </button>
    <button class="fb-x" data-x="precio" title="Quitar precio" hidden>&times;</button>
  </span>
  <span class="fb-chip" data-f="tipo">
    <button class="fb-open" data-f="tipo" aria-expanded="false" aria-haspopup="dialog">
      <span class="fb-k">Tipo</span><span class="fb-v" id="fbv-tipo">Todos</span>
    </button>
    <button class="fb-x" data-x="tipo" title="Quitar tipo" hidden>&times;</button>
  </span>
  <!-- Sólo en la pestaña Inmobiliaria (app.js los muestra). -->
  <span class="fb-chip" data-f="cliente" hidden>
    <button class="fb-open" data-f="cliente" aria-expanded="false" aria-haspopup="dialog">
      <span class="fb-k">Cliente</span><span class="fb-v" id="fbv-cliente">Todos</span>
    </button>
    <button class="fb-x" data-x="cliente" title="Quitar filtro" hidden>&times;</button>
  </span>
  <span class="fb-chip" data-f="etapa" hidden>
    <button class="fb-open" data-f="etapa" aria-expanded="false" aria-haspopup="dialog">
      <span class="fb-k">Etapa</span><span class="fb-v" id="fbv-etapa">Todas</span>
    </button>
    <button class="fb-x" data-x="etapa" title="Quitar filtro" hidden>&times;</button>
  </span>
</div>
<div class="fb-scrim" id="fbScrim" hidden></div>
<div class="fb-pop" id="fbPop" role="dialog" aria-label="Filtro" hidden></div>

  <div class="qbar-box" id="qbarBox">
    <div class="qbar-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <span class="street-chip" id="searchChip" hidden>
        <span id="searchChipText"></span>
        <span class="street-chip-close" id="searchChipClose">&times;</span>
      </span>
      <input type="text" id="searchInput" placeholder="Direcci&#243;n, t&#237;tulo o c&#243;digo&#8230;" autocomplete="off">
      <div class="search-suggestions" id="searchSuggestions"></div>
    </div>
    <span id="tokens"></span>
    <button class="qbar-add" id="qbar-add">+ filtro <span class="qbar-kbd">&#8984;K</span></button>
    <button class="qbar-clear" id="qbar-clear" hidden>Limpiar</button>
  </div>
  <div class="qbar-sentence" id="qbarSentence"></div>

  <div class="qpop qpop-pal" id="palette" hidden>
    <input class="qpop-in" id="palInput" placeholder="Buscar filtro: precio, radio, colonia, fuente&#8230;">
    <div id="palList"></div>
  </div>
  <div class="qpop qpop-ed" id="editor" hidden></div>
</div>

<div class="statebar" id="statebar">
  <span id="statusPills"></span>
  <button class="pill" id="pill-starred" data-group="starred">&#9733; Destacados<span class="pill-count" id="starredCount">0</span></button>
  <div class="statebar-right">
    <div class="seg" role="group" aria-label="Vista">
      <button data-vista="grid">Rejilla</button>
      <button data-vista="split">Rejilla + mapa</button>
    </div>
    <!-- Sólo en Inmobiliaria (app.js lo muestra): alta de una propiedad propia. -->
    <button class="btn-clear" id="nueva-prop" hidden>+ Nueva propiedad</button>
    <button class="btn-clear" id="export-btn">CSV</button>
    <span class="count-tag"><strong id="countNum">0</strong> / <span id="countTotal">0</span></span>
  </div>
</div>

<div class="inm split" id="inm">
  <div class="inm-list" id="inmList">
    <main class="grid" id="grid"></main>
    <div class="pagination" id="pagination"></div>
  </div>
  <div class="inm-map">
    <div id="map"></div>
    <label class="map-follow"><input type="checkbox" id="mapFollow"> Buscar al mover el mapa</label>
    <div class="ub-zoom">
      <button id="mapMas" aria-label="Acercar">+</button>
      <button id="mapMenos" aria-label="Alejar">&#8722;</button>
    </div>
    <div class="map-note" id="mapNote" hidden></div>
    <div class="ub-attr">&#169; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> &#183; <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> &#183; <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a></div>
  </div>
</div>

<!-- Selección: cambia estado, asigna a cliente, compara. Aparece con la primera casilla. -->
<div class="tray" id="tray" hidden>
  <span class="tray-count" id="trayCount"></span>
  <div class="tray-items" id="trayItems"></div>
  <div class="tray-actions">
    <select class="tray-btn" id="trayEstado" aria-label="Cambiar estado">
      <option value="">Cambiar estado&#8230;</option>
      <option>Nuevo</option><option>Revisado</option><option>Contactado</option><option>Rentado</option><option>Descartado</option>
    </select>
    <select class="tray-btn" id="trayCliente" aria-label="Asignar a cliente">
      <option value="">Asignar a cliente&#8230;</option>
    </select>
    <!-- Sólo en Bolsa: guarda la selección en la bolsa propia sin asignarla a nadie. -->
    <button class="tray-btn" id="trayInmo">+ Cat&#225;logo</button>
    <!-- Sólo en Inmobiliaria: lo contrario, borra la ficha de lo seleccionado. -->
    <button class="tray-btn" id="trayQuitar">Eliminar</button>
    <button class="tray-btn" id="trayClear">Quitar selecci&#243;n</button>
    <button class="tray-btn solid" id="trayComparar">Comparar &#8594;</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="texto.js"></script>
<script src="etapas.js"></script>
<script src="menu.js"></script>
<script src="vendor/maplibre-gl.js"></script>
<script src="mapa.js"></script>
<script src="app.js"></script>
</body>
</html>
